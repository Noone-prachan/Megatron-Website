<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO -->
    <title>Megatron MLstore</title>
    <meta name="description" content="Buy premium Mobile Legends: Bang Bang accounts with rare skins, high ranks, and instant delivery. Secure Discord-based transactions with Nepal local payment methods." />
    <meta name="keywords" content="MLBB, Mobile Legends, accounts, buy, sell, skins, heroes, premium accounts, Nepal, eSewa, Khalti" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="MLBB Market — Premium Mobile Legends Accounts" />
    <meta property="og:description" content="Buy premium MLBB accounts with rare skins, high ranks, and instant Discord delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero-banner.png" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#06060c" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Favicon (logo) -->
    <link rel="icon" type="image/png" href="/images/megatronlogo.png" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      body { 
        background: #06060c; 
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      img {
        -webkit-user-drag: none;
        user-drag: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Disable keyboard shortcuts for developer tools
      document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
        }
        
        // Ctrl+Shift+I (Inspect)
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
          e.preventDefault();
        }
        
        // Ctrl+Shift+J (Console)
        if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
          e.preventDefault();
        }
        
        // Ctrl+Shift+C (Inspect Element)
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
          e.preventDefault();
        }

        // Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
          e.preventDefault();
        }
        
        // Ctrl+S (Save As)
        if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
